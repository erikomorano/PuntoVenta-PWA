<html lang="es">
<head>

<meta name="theme-color" content="#1769e0">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e4e8ef;--accent:#1769e0;--accent2:#eaf2ff;--danger:#c62828;--dangerbg:#fdecec;--ok:#16834b;--okbg:#e9f8f0;--warn:#9a6500;--warnbg:#fff4df;--inputbg:#fff}
body.dark{--bg:#0f141c;--card:#171e29;--text:#eef3fb;--muted:#a9b4c5;--line:#2b3544;--accent:#4d94ff;--accent2:#162d4d;--danger:#ff7070;--dangerbg:#3a2024;--ok:#4bd18b;--okbg:#17382a;--warn:#f0bb55;--warnbg:#3b2d18;--inputbg:#111823}
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:4px 12px;display:flex;justify-content:flex-end;align-items:center;min-height:40px}header h1{display:none}h1{font-size:20px;line-height:1;margin:0;font-weight:800;letter-spacing:-.3px}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:0 0 7px}.muted{color:var(--muted);font-size:13px}.money{font-variant-numeric:tabular-nums}
main{width:100%;max-width:760px;margin:0 auto;padding:5px 12px 112px;overflow-x:hidden}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:9px;margin-bottom:6px;box-shadow:0 1px 2px #00000008}
.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin-bottom:12px}
.product{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:9px;text-align:left;min-height:62px;box-shadow:0 1px 2px #00000005}.product:active{transform:scale(.985)}.product b{display:block;font-size:17px;line-height:1.15}.price{color:var(--accent);font-weight:800;margin-top:5px}
button{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--line);color:var(--text);max-width:100%;min-width:0;min-height:44px}button:active{transform:scale(.985)}button.primary{background:var(--accent);color:#fff}button.danger{background:var(--dangerbg);color:var(--danger)}button.ok{background:var(--okbg);color:var(--ok)}button.small{padding:8px 10px;min-height:38px;font-size:13px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.stat strong{display:block;font-size:18px;margin-top:2px}.hero{padding:11px}.heroTotal{font-size:30px;font-weight:850;letter-spacing:-1px}.statusOpen{color:var(--ok)}
.pieces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.piece{padding:6px 8px;min-height:0;border:1px solid var(--line);border-radius:13px;background:var(--card)}.piece b{display:inline;font-size:14px}.piece span{font-size:12px;color:var(--muted)}
.cartrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.cartrow:last-child{border-bottom:0}.cartrow>div:first-child{min-width:0;overflow-wrap:anywhere}.qty{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.qty button{width:36px;height:36px;min-height:36px;padding:0;flex:0 0 36px}.total{font-size:22px;font-weight:850}.paygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.paygrid button{padding:10px 5px;font-size:12px}.productHeader{margin-bottom:5px}.openingInfo{flex-direction:column;align-items:flex-end;gap:2px}.openingValue{font-size:17px;font-weight:600}.expenseToday{font-size:11px;white-space:nowrap}.expenseToday b{font-size:13px;color:var(--text)}.cutTransferRows{display:grid;gap:0}.cutTransfer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.cutTransfer:last-child{border-bottom:0}.cutTransfer b{font-size:13px}.cutTransfer .muted{font-size:11px;line-height:1.25}.netGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.netBox{padding:7px 8px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.netBox .muted{font-size:11px}.netBox b{display:block;font-size:16px;margin-top:2px}
.saleCard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:7px 9px;margin-bottom:5px}.saleCard .saleItems{margin:3px 0}.saleCard .saleItem{padding:1px 0;font-size:13px}.saleCard .total{font-size:18px}.saleItems{margin:9px 0}.saleItem{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef3fa;font-size:12px;font-weight:700}.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--dangerbg);color:var(--danger)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:2px 4px calc(2px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px #00000008}nav button{background:transparent;border-radius:12px;padding:6px 2px 5px;min-height:48px;color:var(--muted);font-size:10px;line-height:1.15;font-weight:650}nav button .ico{display:block;font-size:19px;line-height:20px;margin-bottom:1px}nav button.active{color:var(--accent);background:var(--accent2);font-weight:800}
.empty{padding:25px 5px;text-align:center;color:var(--muted)}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--inputbg);color:var(--text);min-height:45px}input:focus,textarea:focus,select:focus{outline:none!important;border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent2)!important}body.dark .tag{background:#202a38;color:#dbe5f3}body.dark .tag.ok{background:#17382a;color:#5de39a}body.dark .tag.warn{background:#3b2d18;color:#ffd36b}.tag.transfer{background:var(--accent2);color:var(--accent)}.salesListGap{margin-top:8px}.choiceList{display:grid;gap:7px;margin-top:7px}.choiceBtn{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;background:var(--inputbg);border:1px solid var(--line);padding:12px 14px}.choiceBtn.active{border-color:var(--accent);background:var(--accent2);color:var(--text)}.choiceMark{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto}.choiceBtn.active .choiceMark{border-color:var(--accent);background:var(--accent)}label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.resultDialog{text-align:center;padding:6px 2px 2px}.resultIcon{width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:var(--okbg);color:var(--ok);font-size:31px;font-weight:900;display:grid;place-items:center}.resultDialog h2{margin-bottom:7px}.resultMain{font-size:28px;font-weight:850}.resultSub{margin-top:5px;color:var(--muted);font-size:15px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menuBtn{text-align:left;min-height:64px}.warning{padding:11px 12px;border-radius:13px;background:var(--warnbg);color:var(--warn);font-size:13px}
.cutRows{display:grid;gap:0}.cutRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.cutRow:last-child{border-bottom:0}.cutRow b{font-size:14px}.cutRow .muted{font-size:11px}.cutSection{padding:9px}.cutSection h3{font-size:15px;margin-bottom:5px}.cutMoney{font-size:18px;font-weight:800}.compactList{display:grid;gap:0}.compactItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.compactItem:last-child{border-bottom:0}.compactItem b{font-size:14px}.compactItem .muted{font-size:11px}.moneyGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.moneyBox{padding:7px 8px;border:1px solid var(--line);border-radius:11px;background:var(--card)}.moneyBox .muted{font-size:11px}.moneyBox b{display:block;font-size:16px;margin-top:2px}.cutClose{padding-top:8px}.cutClose input{margin-top:3px}.cutClose .row{gap:6px}.cutClose button{padding:9px 11px}.inlinePieces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.inlinePiece{border:1px solid var(--line);border-radius:10px;padding:6px 8px}.inlinePiece b{font-size:14px}.inlinePiece span{display:block;font-size:11px;color:var(--muted)}
.quickSummary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:8px}.quickBox{padding:6px 7px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.quickBox .muted{font-size:10px}.quickBox b{display:block;font-size:14px;margin-top:1px}.saleName{margin-top:3px;font-size:12px}.saleName b{font-weight:750}.expenseCard{border-left:3px solid var(--warn)}.expenseAmount{color:var(--danger);font-weight:850}.archiveSale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.archiveSale:last-child{border-bottom:0}.archiveSale b{font-size:13px}.archiveSale .muted{font-size:11px}.archiveDetail{margin-top:7px}
@media(max-width:390px){.paygrid{grid-template-columns:repeat(2,minmax(0,1fr))}.paygrid button{font-size:12px;padding:9px 3px}.statgrid{grid-template-columns:1fr 1fr}.pieces,.inlinePieces{grid-template-columns:repeat(2,minmax(0,1fr))}.cartrow{grid-template-columns:minmax(0,1fr) auto}.qty{justify-content:flex-end}}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pieces,.inlinePieces{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<section id="caja" class="screen active">
 <div class="card hero">
  <div class="between"><div><div class="muted">Estado</div><b id="boxState">Caja cerrada</b></div><div class="row openingInfo"><div class="money openingValue" id="openingBadge"></div></div></div>
  <div style="margin-top:12px"><div class="muted">Ventas de hoy</div><div class="heroTotal money" id="todayTotal">$0.00</div><div id="quickSummary" class="quickSummary"></div></div>
  <div id="openBoxArea" style="margin-top:12px"></div>
 </div>
 <div class="card"><div class="between"><h2 style="margin:0">Piezas vendidas</h2><span class="muted">Hoy</span></div><div id="todayPieces" class="inlinePieces" style="margin-top:5px"></div></div>
 <div id="productsOnCaja" class="grid"></div>
 <div class="card"><div class="between"><h2>Carrito</h2><button class="small danger" onclick="clearCart()">Vaciar</button></div><div id="cart"></div><div class="between"><span>Total</span><span class="total money" id="cartTotal">$0.00</span></div><div class="paygrid" style="margin-top:10px"><button class="primary" onclick="pay('Efectivo')">💵 Efectivo</button><button onclick="pay('Transferencia')">↔️ Transferencia</button><button onclick="pay('Deudor')">📝 Pendiente</button><button onclick="addExpense()">➕ Gasto</button></div></div>
</section>

<section id="ventas" class="screen"><div class="between"><h2>Ventas</h2><div class="row"><span class="muted" id="salesCount"></span><button class="small" onclick="addExpense()">＋ Gasto</button></div></div><div id="salesList" class="salesListGap"></div></section>
<section id="productos" class="screen"><div class="between productHeader"><h2>Productos</h2><button type="button" class="primary small" onclick="editProduct()">＋ Agregar</button></div><div id="productsList"></div></section>
<section id="pendientes" class="screen"><div class="between"><h2>Pendientes</h2><span class="muted">Por cobrar</span></div><div id="debtsList"></div></section>
<section id="mas" class="screen"><h2>Más</h2><div class="card menuGrid"><button class="menuBtn" onclick="showTab('pagos')">💰<br>Pagos</button><button class="menuBtn" onclick="showTab('corte')">📊<br>Corte de caja</button><button class="menuBtn" onclick="showTab('historial')">🗂️<br>Historial</button><button class="menuBtn" onclick="openSettings()">⚙️<br>Configuración</button></div></section>
<section id="pagos" class="screen"><div class="between"><h2>Pagos</h2><button class="small" onclick="showTab('mas')">← Más</button></div><div id="paymentsList"></div></section>
<section id="corte" class="screen"><div class="between"><h2>Corte de caja</h2><button class="small" onclick="showTab('mas')">← Más</button></div><div id="cutPreview"></div></section>
<section id="historial" class="screen"><div class="between"><h2>Historial</h2><button class="small" onclick="showTab('mas')">← Más</button></div><div id="historyList"></div></section>
</main>
<nav>
<button type="button" data-tab="caja" class="active" onclick="showTab('caja')"><span class="ico">🏠</span>Caja</button>
<button type="button" data-tab="ventas" onclick="showTab('ventas')"><span class="ico">🧾</span>Ventas</button>
<button type="button" data-tab="productos" onclick="showTab('productos')"><span class="ico">📦</span>Productos</button>
<button type="button" data-tab="pendientes" onclick="showTab('pendientes')"><span class="ico">📋</span>Pendientes</button>
<button type="button" data-tab="mas" onclick="showTab('mas')"><span class="ico">⋮</span>Más</button>
</nav>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='caja_erick_v3';
let db=load(),cartItems=[],editingProductId=null,currentTab='caja';
const productsList=document.getElementById('productsList'),productsOnCaja=document.getElementById('productsOnCaja'),cartEl=document.getElementById('cart'),cartTotalEl=document.getElementById('cartTotal'),debtsList=document.getElementById('debtsList'),cutPreview=document.getElementById('cutPreview'),historyList=document.getElementById('historyList'),paymentsList=document.getElementById('paymentsList'),salesList=document.getElementById('salesList'),salesCount=document.getElementById('salesCount'),sheet=document.getElementById('sheet'),modal=document.getElementById('modal'),boxState=document.getElementById('boxState'),openingBadge=document.getElementById('openingBadge'),todayTotal=document.getElementById('todayTotal'),todayPieces=document.getElementById('todayPieces'),quickSummary=document.getElementById('quickSummary');
function fresh(){return{products:[],opening:0,open:false,sales:[],debts:[],payments:[],expenses:[],archives:[]}}
function load(){try{let x=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));x.sales=x.sales||[];x.debts=x.debts||[];x.payments=x.payments||[];x.expenses=x.expenses||[];x.archives=x.archives||[];return x}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return'$'+Number(n||0).toFixed(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sum(a,f){return(a||[]).reduce((x,y)=>x+Number(f(y)||0),0)}
function activeSales(){return db.sales.filter(s=>s.status!=='cancelled')}
function todaySalesTotal(){return sum(activeSales(),s=>s.total)}
function saleNo(){let n=1;activeSales().forEach(s=>{let m=String(s.saleNo||'').match(/(\d+)$/);if(m)n=Math.max(n,Number(m[1])+1)});db.archives.forEach(a=>(a.sales||[]).forEach(s=>{let m=String(s.saleNo||'').match(/(\d+)$/);if(m)n=Math.max(n,Number(m[1])+1)}));return String(n).padStart(3,'0')}
function parentTab(id){if(['ventas','productos','pendientes','mas'].includes(id))return'caja';if(['pagos','corte','historial'].includes(id))return'mas';return'caja'}
function showTab(id,fromBack=false){let el=document.getElementById(id);if(!el)id='caja',el=document.getElementById(id);currentTab=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));renderAll()}
function appNotice(message,title='Aviso'){sheet.innerHTML='<div class="resultDialog"><div class="resultIcon">!</div><h2>'+esc(title)+'</h2><div class="resultSub" style="font-size:16px;color:var(--text)">'+esc(message)+'</div><button class="primary" style="width:100%;margin-top:16px" onclick="closeModal()">Entendido</button></div>';openModal()}
function appConfirm(title,message,onOk,okText='Confirmar',danger=false){window.__confirmAction=typeof onOk==='function'?onOk:null;sheet.innerHTML='<div class="resultDialog"><div class="resultIcon" style="background:'+(danger?'var(--dangerbg)':'var(--warnbg)')+';color:'+(danger?'var(--danger)':'var(--warn)')+'">?</div><h2>'+esc(title)+'</h2><div class="resultSub" style="font-size:15px;color:var(--text)">'+esc(message)+'</div><div class="row" style="justify-content:center;margin-top:16px;width:100%"><button onclick="closeModal()">Cancelar</button><button class="'+(danger?'danger':'primary')+'" onclick="runConfirm()">'+esc(okText)+'</button></div></div>';openModal()}
function runConfirm(){let fn=window.__confirmAction;window.__confirmAction=null;closeModal();if(fn)fn()}
function showResultDialog(title,line1,line2=''){sheet.innerHTML='<div class="resultDialog"><div class="resultIcon">✓</div><h2>'+esc(title)+'</h2><div class="resultMain money">'+esc(line1)+'</div>'+(line2?'<div class="resultSub">'+esc(line2)+'</div>':'')+'<button class="primary" style="width:100%;margin-top:16px" onclick="closeModal()">Continuar</button></div>';openModal();setTimeout(()=>{try{document.activeElement?.blur()}catch(e){}},50)}
function openModal(){modal.classList.add('show')}
function closeModal(){modal.classList.remove('show');sheet.innerHTML='';window.__confirmAction=null}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
function handleAndroidBack(){if(modal.classList.contains('show')){closeModal();return true}if(currentTab!=='caja'){showTab(parentTab(currentTab),true);return true}appConfirm('Salir del Punto de venta','Los datos guardados no se perderán.',()=>{if(window.Android&&typeof window.Android.exitApp==='function')window.Android.exitApp()},'Salir',true);return true}
function applyTheme(){let dark=localStorage.getItem('caja_dark')==='1';document.body.classList.toggle('dark',dark);if(window.Android&&typeof window.Android.setDarkStatus==='function')window.Android.setDarkStatus(dark)}
function toggleDark(){localStorage.setItem('caja_dark',document.getElementById('darkMode').checked?'1':'0');applyTheme()}
function openSettings(){let dark=localStorage.getItem('caja_dark')==='1';sheet.innerHTML='<h2>Configuración</h2><div class="card"><b>Punto de Venta</b><div class="muted" style="margin-top:4px">Punto de Venta Desarrollado por Erick Morales</div></div><label>Nombre del negocio</label><input id="biz" value="'+esc(localStorage.getItem('caja_biz')||'Punto de Venta')+'"><div class="card" style="margin-top:10px"><div class="between"><div><b>Modo oscuro</b><div class="muted">Cambia la apariencia de toda la aplicación.</div></div><input id="darkMode" type="checkbox" style="width:22px;min-height:22px" '+(dark?'checked':'')+' onchange="toggleDark()"></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="localStorage.setItem(\'caja_biz\',document.getElementById(\'biz\').value||\'Punto de Venta\');closeModal();renderAll()">Guardar</button><button onclick="closeModal()">Cerrar</button></div>';openModal()}
function openBox(){sheet.innerHTML='<h2>Abrir caja</h2><label>Fondo inicial</label><input id="opening" type="number" step="0.01" min="0" value="'+(db.opening||0)+'"><div class="row" style="margin-top:12px"><button class="primary" onclick="doOpen()">Abrir caja</button><button onclick="closeModal()">Cancelar</button></div>';openModal()}
function doOpen(){let n=Number(document.getElementById('opening').value);if(!Number.isFinite(n)||n<0)return appNotice('Escribe un fondo válido.');db.opening=n;db.open=true;save();closeModal()}
function addProductToCart(id){if(!db.open)return appNotice('Primero abre la caja.');let p=db.products.find(x=>x.id===id);if(!p)return;let x=cartItems.find(i=>i.productId===id);if(x)x.qty++;else cartItems.push({productId:id,name:p.name,price:Number(p.price),qty:1});renderAll()}
function changeCart(id,d){let x=cartItems.find(i=>i.productId===id);if(!x)return;x.qty+=d;if(x.qty<=0)cartItems=cartItems.filter(i=>i!==x);renderAll()}
function clearCart(){if(!cartItems.length)return;appConfirm('Vaciar carrito','Se quitarán todos los productos del carrito.',()=>{cartItems=[];renderAll()},'Vaciar',true)}
function cartTotal(){return sum(cartItems,i=>i.qty*i.price)}

function renderCaja(){boxState.textContent=db.open?'Caja abierta':'Caja cerrada';boxState.className=db.open?'statusOpen':'';openingBadge.textContent=db.open?'Fondo '+money(db.opening):'';todayTotal.textContent=money(todaySalesTotal());let cash=currentCashSales(),tr=currentTransferSales(),pending=currentPendingSales(),pc=cashDebtPayments(),pt=transferDebtPayments(),exp=currentExpenses();if(quickSummary)quickSummary.innerHTML='<div class="quickBox"><span class="muted">Efectivo</span><b>'+money(cash+pc)+'</b></div><div class="quickBox"><span class="muted">Transfer.</span><b>'+money(tr+pt)+'</b></div><div class="quickBox"><span class="muted">Pendiente</span><b>'+money(pending)+'</b></div><div class="quickBox"><span class="muted">Gastos</span><b>'+money(exp)+'</b></div>';let pr=productReport();todayPieces.innerHTML=pr.length?pr.map(x=>'<div class="piece"><b>'+esc(x[0])+'</b><span>'+x[1]+' '+(x[1]===1?'pieza':'piezas')+'</span></div>').join(''):'<div class="muted">Aún no hay piezas vendidas.</div>';let oa=document.getElementById('openBoxArea');if(oa)oa.innerHTML=db.open?'':'<button class="primary" onclick="openBox()">Abrir caja</button>';productsOnCaja.innerHTML=db.products.length?db.products.map(p=>'<button type="button" class="product" onclick="addProductToCart(\''+p.id+'\')"><b>'+esc(p.name)+'</b><span class="price">'+money(p.price)+'</span></button>').join(''):'<div class="card empty" style="grid-column:1/-1">Agrega tus productos desde <b>Productos</b>.</div>';cartEl.innerHTML=cartItems.length?cartItems.map(i=>'<div class="cartrow"><div><b>'+esc(i.name)+'</b><div class="muted">'+money(i.price)+' c/u</div></div><div class="qty"><button type="button" onclick="changeCart(\''+i.productId+'\',-1)">−</button><b>'+i.qty+'</b><button type="button" onclick="changeCart(\''+i.productId+'\',1)">+</button><b class="money">'+money(i.qty*i.price)+'</b></div></div>').join(''):'<div class="empty">Agrega productos al carrito.</div>';cartTotalEl.textContent=money(cartTotal())}
function saleVisual(s){let pending=s.method==='Deudor'&&s.status==='pending';if(pending)return{label:'🟠 Pendiente',cls:'warn'};if(s.method==='Transferencia')return{label:'🔵 Transferencia',cls:'transfer'};return{label:'🟢 Pagada',cls:'ok'}}

function renderDebts(){let list=db.debts.filter(d=>d.status==='pending'&&d.balance>0);debtsList.innerHTML=list.length?'<div class="card compactList">'+list.map(d=>{let s=db.sales.find(x=>x.id===d.saleId),paid=sum(d.payments,p=>p.amount);return '<div class="compactItem"><div><b>'+esc(d.note)+'</b><div class="muted">Venta #'+(s?.saleNo||'---')+' · Pagado '+money(paid)+' / '+money(d.originalAmount)+'</div></div><div class="row"><b>'+money(d.balance)+'</b><button class="small primary" onclick="event.stopPropagation();payDebt(\''+d.id+'\')">Pagar</button></div></div>'}).join('')+'</div>':'<div class="card empty">No hay ventas pendientes de cobrar.</div>'}
function payDebt(id){let d=db.debts.find(x=>x.id===id);if(!d)return;window.__debtPayMethod='Efectivo';sheet.innerHTML='<h2>Cobrar pendiente</h2><div class="muted">Venta #'+(db.sales.find(s=>s.id===d.saleId)?.saleNo||'---')+'</div><div class="total" style="margin-top:7px">Saldo '+money(d.balance)+'</div><label>Importe</label><input id="pa" type="number" min="0.01" max="'+d.balance+'" step="0.01" value="'+d.balance+'"><label>Medio de pago</label><div class="choiceList"><button type="button" id="pmCash" class="choiceBtn active" onclick="setDebtPayMethod(\'Efectivo\')"><span>Efectivo</span><span class="choiceMark"></span></button><button type="button" id="pmTransfer" class="choiceBtn" onclick="setDebtPayMethod(\'Transferencia\')"><span>Transferencia</span><span class="choiceMark"></span></button></div><div class="row" style="margin-top:12px"><button class="primary" onclick="finishDebtPayment(\''+id+'\')">Registrar pago</button><button onclick="closeModal()">Cancelar</button></div>';openModal()}

function finishDebtPayment(id){let d=db.debts.find(x=>x.id===id),a=Number(document.getElementById('pa').value);if(!d||!Number.isFinite(a)||a<=0||a>d.balance)return appNotice('Importe no válido.');let m=window.__debtPayMethod||'Efectivo',now=new Date().toISOString();d.payments.push({id:uid(),date:now,amount:a,method:m});d.balance=Math.max(0,d.balance-a);d.status=d.balance===0?'paid':'pending';db.payments.push({id:uid(),date:now,amount:a,method:m,debtId:id,saleId:d.saleId});let s=db.sales.find(x=>x.id===d.saleId);if(s&&d.balance===0){s.status='paid';s.method=m}else if(s){s.status='pending';s.method='Deudor'}save();closeModal();showResultDialog(d.balance===0?'Pago registrado':'Abono registrado',d.balance===0?'Venta #'+(db.sales.find(s=>s.id===d.saleId)?.saleNo||'---')+' liquidada.':'Saldo restante: '+money(d.balance),m)}

function finishCorrection(id){let s=db.sales.find(x=>x.id===id),ins=[...document.querySelectorAll('.corrqty')];if(!s)return;let items=s.items.map((i,k)=>({...i,qty:Math.max(0,Math.floor(Number(ins[k].value)||0))})).filter(i=>i.qty>0);if(!items.length)return appNotice('La venta quedaría en cero.');let oldTotal=s.total;s.items=items;s.total=sum(s.items,i=>i.qty*i.price);let d=db.debts.find(x=>x.saleId===s.id);if(d&&d.status!=='deleted'){let paid=sum(d.payments,p=>p.amount);d.originalAmount=s.total;d.balance=Math.max(0,s.total-paid);d.status=d.balance===0?'paid':'pending';if(d.balance>0){s.status='pending';s.method='Deudor'}else{let last=d.payments[d.payments.length-1];s.status='paid';if(last)s.method=last.method}}save();closeModal();showResultDialog('Venta actualizada','Venta #'+(s.saleNo||'---')+' · '+money(s.total),oldTotal!==s.total?'Nuevo total':'Sin cambio de total')}
function isDebtSale(s){return !!s.originPending||db.debts.some(d=>d.saleId===s.id)}

function currentTransferSales(){return sum(activeSales().filter(s=>s.method==='Transferencia'&&s.status==='paid'&&!isDebtSale(s)),s=>s.total)}
function currentPendingSales(){return sum(pendingPeople(),d=>d.balance)}

function closeBox(){if(!db.open)return appNotice('La caja ya está cerrada.');let cash=currentCashSales(),tr=currentTransferSales(),pending=currentPendingSales(),pc=cashDebtPayments(),pt=transferDebtPayments(),cashExp=currentCashExpenses(),transferExp=currentTransferExpenses(),exp=cashExp+transferExp,expected=db.opening+cash+pc-cashExp,counted=Number(document.getElementById('counted').value);if(!Number.isFinite(counted)||counted<0)return appNotice('Escribe el efectivo contado.');appConfirm('Cerrar caja','Se guardará el corte con las ventas, gastos y pendientes actuales.',()=>finishCloseBox(counted,cash,tr,pending,pc,pt,exp,expected),'Cerrar caja')}
function finishCloseBox(counted,cash,tr,pending,pc,pt,exp,expected){let cashExp=currentCashExpenses(),transferExp=currentTransferExpenses();let archive={id:uid(),date:new Date().toISOString(),opening:db.opening,sales:JSON.parse(JSON.stringify(db.sales)),debts:JSON.parse(JSON.stringify(db.debts)),payments:JSON.parse(JSON.stringify(db.payments)),expenses:JSON.parse(JSON.stringify(db.expenses)),productsSold:productReport(),totals:{cash,transfer:tr,pending,cashDebt:pc,transferDebt:pt,expenses:exp,cashExpenses:cashExp,transferExpenses:transferExp,cashGenerated:cash+pc,totalSold:todaySalesTotal(),expected,counted,difference:counted-expected}};db.archives.unshift(archive);db.sales=[];db.payments=[];db.expenses=[];db.debts=[];db.open=false;db.opening=0;save();showTab('historial');showResultDialog('Corte guardado','Diferencia: '+money(counted-expected),counted===expected?'Caja cuadrada':(counted>expected?'Sobrante':'Faltante'))}
function renderHistory(){historyList.innerHTML=db.archives.length?db.archives.map(a=>'<div class="card"><div class="between"><div><b>'+new Date(a.date).toLocaleString()+'</b><div class="muted">Vendido '+money(a.totals.totalSold||0)+' · Transferencias '+money((a.totals.transfer||0)+(a.totals.transferDebt||0))+'</div></div><span class="tag '+(a.totals.difference===0?'ok':a.totals.difference>0?'ok':'bad')+'">'+(a.totals.difference===0?'Cuadra':(a.totals.difference>0?'Sobra ':'Falta ')+money(Math.abs(a.totals.difference)))+'</span></div><div class="row" style="margin-top:8px"><button class="small" onclick="viewArchive(\''+a.id+'\')">Abrir corte</button><button class="small" onclick="pdfArchive(\''+a.id+'\')">Guardar PDF</button><button class="small danger" onclick="deleteArchive(\''+a.id+'\')">Eliminar</button></div></div>').join(''):'<div class="card empty">Todavía no hay cortes guardados.</div>'}
function archiveTransferReceipts(a){let direct=(a.sales||[]).filter(s=>s.status==='paid'&&s.method==='Transferencia'&&!s.originPending).map(s=>({date:s.date,saleNo:s.saleNo,note:s.note||'Sin referencia',items:s.items,amount:s.total,type:'Venta'}));let debtPays=(a.payments||[]).filter(p=>p.method==='Transferencia').map(p=>{let s=(a.sales||[]).find(x=>x.id===p.saleId),d=(a.debts||[]).find(x=>x.id===p.debtId);return{date:p.date,saleNo:s?.saleNo||'---',note:d?.note||s?.note||'Cliente',items:s?.items||[],amount:p.amount,type:'Pago de pendiente'}});return direct.concat(debtPays).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function viewArchive(id){let a=db.archives.find(x=>x.id===id);if(!a)return;let pr=(a.productsSold||[]).map(x=>'<div class="between"><span><b>'+esc(x[0])+'</b><br><span class="muted">'+x[1]+' '+(x[1]===1?'pieza':'piezas')+'</span></span><b>'+money(x[2]??0)+'</b></div>').join('');let pend=(a.sales||[]).filter(s=>s.method==='Deudor'&&s.status==='pending').map(s=>'<div class="between"><span>'+esc(s.note||'Cliente')+' · Venta #'+(s.saleNo||'---')+'</span><b>'+money(s.total)+'</b></div>').join('');let transfers=archiveTransferReceipts(a).map(s=>'<div class="archiveSale"><span><b>Venta #'+(s.saleNo||'---')+'</b><div class="muted">'+new Date(s.date).toLocaleString()+' · '+(s.note?esc(s.note):'Sin referencia')+' · '+(s.type==='Pago de pendiente'?'Pago de pendiente':s.items.map(i=>esc(i.name)+' × '+i.qty).join(' · '))+'</div></span><b>'+money(s.amount)+'</b></div>').join('');let expenses=(a.expenses||[]).map(e=>'<div class="compactItem"><div><b>'+esc(e.concept)+'</b><div class="muted">'+new Date(e.date).toLocaleString()+' · '+expenseMethod(e)+'</div></div><b class="expenseAmount">− '+money(e.amount)+'</b></div>').join('');sheet.innerHTML='<h2>Corte '+new Date(a.date).toLocaleString()+'</h2><div class="card"><h3>Ventas</h3><div class="between"><span>Total vendido</span><b>'+money(a.totals.totalSold||0)+'</b></div><div class="between"><span>Efectivo</span><b>'+money(a.totals.cashGenerated ?? ((a.totals.cash||0)+(a.totals.cashDebt||0)))+'</b></div><div class="between"><span>Transferencias</span><b>'+money((a.totals.transfer||0)+(a.totals.transferDebt||0))+'</b></div><div class="between"><span>Pendiente de cobrar</span><b>'+money(a.totals.pending||0)+'</b></div><div class="between"><span>Gastos en efectivo</span><b>− '+money(a.totals.cashExpenses ?? (a.totals.expenses||0))+'</b></div><div class="between"><span>Gastos en transferencia</span><b>− '+money(a.totals.transferExpenses||0)+'</b></div><div class="between"><b>Ventas − gastos</b><b>'+money((a.totals.totalSold||0)-(a.totals.expenses||0))+'</b></div></div><div class="card"><div class="between"><h3 style="margin:0">Transferencias recibidas</h3><span class="muted">'+archiveTransferReceipts(a).length+' venta'+(archiveTransferReceipts(a).length===1?'':'s')+'</span></div><div class="archiveDetail">'+(transfers||'<div class="muted">No hubo ventas por transferencia.</div>')+'</div></div><div class="card"><h3>Gastos / retiros</h3><div class="compactList">'+(expenses||'<div class="muted">No hubo gastos.</div>')+'</div></div><div class="card"><h3>Productos vendidos</h3>'+pr+'<hr><div class="between"><b>Gran total</b><b class="total">'+money(a.totals.totalSold||0)+'</b></div></div><div class="card"><h3>Pendientes al cierre</h3>'+(pend||'<div class="muted">Ninguno.</div>')+'</div><div class="card"><h3>Efectivo</h3><div class="between"><span>Fondo inicial</span><b>'+money(a.opening)+'</b></div><div class="between"><span>Efectivo generado por ventas</span><b>+ '+money(a.totals.cashGenerated ?? ((a.totals.cash||0)+(a.totals.cashDebt||0)))+'</b></div><div class="between"><span>Gastos en efectivo</span><b>− '+money(a.totals.cashExpenses ?? (a.totals.expenses||0))+'</b></div><div class="between"><b>Efectivo esperado</b><b>'+money(a.totals.expected)+'</b></div><div class="between"><b>Efectivo contado</b><b>'+money(a.totals.counted)+'</b></div><div class="between"><b>Diferencia</b><b>'+money(a.totals.difference)+'</b></div></div><div class="row"><button class="primary" onclick="pdfArchive(\''+a.id+'\')">Guardar PDF</button><button onclick="closeModal()">Cerrar</button></div>';openModal()}
function deleteArchive(id){appConfirm('Eliminar corte','Se eliminará este corte del historial. Esta acción no se puede deshacer.',()=>{db.archives=db.archives.filter(x=>x.id!==id);save()},'Eliminar',true)}
function pdfArchive(id){let a=db.archives.find(x=>x.id===id);if(!a)return;let lines=[];lines.push(localStorage.getItem('caja_biz')||'Punto de Venta','CORTE DE CAJA',new Date(a.date).toLocaleString(),'','VENTAS DEL DIA','Total vendido: '+money(a.totals.totalSold||0),'Efectivo: '+money(a.totals.cashGenerated ?? ((a.totals.cash||0)+(a.totals.cashDebt||0))),'Transferencias: '+money((a.totals.transfer||0)+(a.totals.transferDebt||0)),'Pendiente de cobrar: '+money(a.totals.pending||0),'Gastos en efectivo: -'+money(a.totals.cashExpenses ?? (a.totals.expenses||0)),'Gastos en transferencia: -'+money(a.totals.transferExpenses||0),'Ventas - gastos: '+money((a.totals.totalSold||0)-(a.totals.expenses||0)),'','TRANSFERENCIAS RECIBIDAS');let transfers=archiveTransferReceipts(a);if(transfers.length)transfers.forEach(s=>lines.push('Venta #'+(s.saleNo||'---')+' · '+new Date(s.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+(s.note||'Sin referencia')+' · '+(s.type==='Pago de pendiente'?'Pago de pendiente':s.items.map(i=>i.name+' × '+i.qty).join(' · '))+' · '+money(s.amount)));else lines.push('Sin ventas por transferencia.');lines.push('','GASTOS / RETIROS');if((a.expenses||[]).length)a.expenses.forEach(e=>lines.push(new Date(e.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+e.concept+' · '+expenseMethod(e)+' · -'+money(e.amount)));else lines.push('Sin gastos.');lines.push('','PRODUCTOS VENDIDOS');(a.productsSold||[]).forEach(x=>lines.push(x[0]+': '+x[1]+' '+(x[1]===1?'pieza':'piezas')+' - '+money(x[2]??0)));lines.push('','PENDIENTES AL CIERRE');(a.sales||[]).filter(s=>s.method==='Deudor'&&s.status==='pending').forEach(s=>lines.push((s.note||'Cliente')+' - Venta #'+(s.saleNo||'---')+': '+money(s.total)));lines.push('','EFECTIVO','Fondo inicial: '+money(a.opening),'Efectivo generado por ventas: '+money(a.totals.cashGenerated ?? ((a.totals.cash||0)+(a.totals.cashDebt||0))),'Gastos en efectivo: '+money(a.totals.cashExpenses ?? (a.totals.expenses||0)),'Efectivo esperado: '+money(a.totals.expected),'Efectivo contado: '+money(a.totals.counted),'Diferencia: '+money(a.totals.difference));saveCutPdf(lines,'corte-'+new Date(a.date).toISOString().slice(0,10)+'-'+String(a.id).slice(-5)+'.pdf')}
function winAnsiByte(ch){const m={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8a,'‹':0x8b,'Œ':0x8c,'Ž':0x8e,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9a,'›':0x9b,'œ':0x9c,'ž':0x9e,'Ÿ':0x9f,'À':0xc0,'Á':0xc1,'Â':0xc2,'Ã':0xc3,'Ä':0xc4,'Å':0xc5,'Æ':0xc6,'Ç':0xc7,'È':0xc8,'É':0xc9,'Ê':0xca,'Ë':0xcb,'Ì':0xcc,'Í':0xcd,'Î':0xce,'Ï':0xcf,'Ð':0xd0,'Ñ':0xd1,'Ò':0xd2,'Ó':0xd3,'Ô':0xd4,'Õ':0xd5,'Ö':0xd6,'Ø':0xd8,'Ù':0xd9,'Ú':0xda,'Û':0xdb,'Ü':0xdc,'Ý':0xdd,'Þ':0xde,'ß':0xdf,'à':0xe0,'á':0xe1,'â':0xe2,'ã':0xe3,'ä':0xe4,'å':0xe5,'æ':0xe6,'ç':0xe7,'è':0xe8,'é':0xe9,'ê':0xea,'ë':0xeb,'ì':0xec,'í':0xed,'î':0xee,'ï':0xef,'ð':0xf0,'ñ':0xf1,'ò':0xf2,'ó':0xf3,'ô':0xf4,'õ':0xf5,'ö':0xf6,'ø':0xf8,'ù':0xf9,'ú':0xfa,'û':0xfb,'ü':0xfc,'ý':0xfd,'þ':0xfe,'ÿ':0xff};return m[ch]??(ch.charCodeAt(0)<256?ch.charCodeAt(0):63)}
function pdfEscapeText(t){return [...String(t)].map(winAnsiByte).map(b=>String.fromCharCode(b)).join('').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)' )}
function makeSimplePdf(lines){const pageW=595,pageH=842,margin=40,lineH=14,maxLines=52;let pages=[];for(let i=0;i<lines.length;i+=maxLines)pages.push(lines.slice(i,i+maxLines));let objs=[];objs[1]='<< /Type /Catalog /Pages 2 0 R >>';objs[2]='';const pageIds=[],contentIds=[];for(let i=0;i<pages.length;i++){pageIds.push(3+i*2);contentIds.push(4+i*2)}const fontId=3+pages.length*2;objs[fontId]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';for(let i=0;i<pages.length;i++){const pid=pageIds[i],cid=contentIds[i];let y=pageH-margin;let stream='BT\n/F1 10 Tf\n';for(const line of pages[i]){const clean=String(line).replace(/\t/g,'    ').slice(0,100);stream+=`1 0 0 1 ${margin} ${y} Tm (${pdfEscapeText(clean)}) Tj\n`;y-=lineH;if(y<margin)break}stream+='ET';objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${fontId} 0 R >> >> /Contents ${cid} 0 R >>`;objs[cid]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`}objs[2]=`<< /Type /Pages /Kids [${pageIds.map(id=>id+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;let out='%PDF-1.4\n',offsets=[0];for(let i=1;i<objs.length;i++){offsets[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}const xref=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`;for(let i=1;i<objs.length;i++)out+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
async function saveCutPdf(lines,filename){if(window.Android&&typeof window.Android.savePdfText==='function'){window.Android.savePdfText(lines.join('\n'),filename);return}try{const blob=makeSimplePdf(lines);const file=new File([blob],filename,{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'Corte de caja',text:'Punto de Venta',files:[file]});return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);appNotice('PDF generado. En iPhone puedes abrirlo y guardarlo en Archivos.','PDF')}catch(e){appNotice('No se pudo compartir el PDF. Puedes intentarlo de nuevo.','PDF')}}
function viewSale(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let pending=s.method==='Deudor'&&s.status==='pending',d=db.debts.find(x=>x.saleId===s.id),remaining=d&&d.status==='pending'?d.balance:0,v=saleVisual(s);sheet.innerHTML='<h2>Venta #'+(s.saleNo||'---')+'</h2><div class="muted">'+new Date(s.date).toLocaleString()+'</div><div style="margin-top:8px"><span class="tag '+v.cls+'">'+v.label+'</span></div><div class="card" style="margin-top:10px">'+s.items.map(i=>'<div class="between" style="padding:5px 0"><span>'+esc(i.name)+' × '+i.qty+'</span><b>'+money(i.qty*i.price)+'</b></div>').join('')+'<hr><div class="between"><b>Total</b><b class="total">'+money(s.total)+'</b></div>'+(s.note?'<div class="muted" style="margin-top:7px">'+(s.method==='Transferencia'?'Transferencia de: ':'Cliente: ')+esc(s.note)+'</div>':'')+(remaining>0?'<div class="warning" style="margin-top:8px">Saldo pendiente: <b>'+money(remaining)+'</b></div>':'')+'</div><div class="row"><button class="primary" onclick="correctSale(\''+id+'\')">Editar venta</button><button onclick="closeModal()">Cerrar</button></div>';openModal()}
